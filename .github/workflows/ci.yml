name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint · Types · Build · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (type-checks included)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key

      - name: Unit tests (local AI engine)
        run: npm run test:unit

      - name: Guard against committed secrets
        run: |
          if git grep -nE '(sbp_[a-z0-9]{40}|ghp_[A-Za-z0-9]{36}|vcp_[A-Za-z0-9]{32})' -- . ; then
            echo "::error::A live credential appears to be committed."
            exit 1
          fi
          echo "No credential patterns found."
